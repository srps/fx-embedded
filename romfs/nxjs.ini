; Runtime config for fx-embedded (packed into the NRO; read next to
; romfs:/main.js). nxjs-nro prepends the [runtime] version pin.
;
; This app runs fx-term.wasm in V8. WebAssembly needs the JIT plus reserved
; code space: `wasm = on` is sugar for code_headroom_mb = 64 (dual-mapped,
; so ~128 MiB real). Launch hbmenu via title takeover (hold R on a game)
; for the application memory regime — applet mode plus wasm plus Skia is
; tighter than we like.
[v8]
wasm = on
